<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>피카츄 배구</title>
    <meta name="description" content="브라우저에서 플레이하는 피카츄 배구" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://retro.oosu.dev/pikachu/" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= htmlWebpackPlugin.options.assetPrefix %>resources/assets/images/IDI_PIKAICON-0.png"
    />
    <link rel="manifest" href="<%= htmlWebpackPlugin.options.manifestPath %>" />
    <link
      rel="stylesheet"
      href="<%= htmlWebpackPlugin.options.assetPrefix %>resources/style.css?v=<%= htmlWebpackPlugin.options.buildVersion %>"
    />
  </head>
  <body>
    <div id="flex-container">
      <div id="game-canvas-container"></div>

      <div id="menu-bar" aria-hidden="true">
        <button id="game-dropdown-btn" class="dropdown-btn" type="button"></button>
        <div id="game-dropdown" class="dropdown">
          <button id="pause-btn" type="button"></button>
          <button id="restart-btn" type="button"></button>
        </div>

        <button id="options-dropdown-btn" class="dropdown-btn" type="button"></button>
        <div id="options-dropdown" class="dropdown">
          <button id="graphic-submenu-btn" class="submenu-btn" type="button"></button>
          <div id="graphic-submenu" class="submenu">
            <button id="graphic-sharp-btn" class="selected" type="button"></button>
            <button id="graphic-soft-btn" type="button"></button>
          </div>

          <button id="bgm-submenu-btn" class="submenu-btn" type="button"></button>
          <div id="bgm-submenu" class="submenu">
            <button id="bgm-on-btn" class="selected" type="button"></button>
            <button id="bgm-off-btn" type="button"></button>
          </div>

          <button id="sfx-submenu-btn" class="submenu-btn" type="button"></button>
          <div id="sfx-submenu" class="submenu">
            <button id="stereo-btn" class="selected" type="button"></button>
            <button id="mono-btn" type="button"></button>
            <button id="sfx-off-btn" type="button"></button>
          </div>

          <button id="speed-submenu-btn" class="submenu-btn" type="button"></button>
          <div id="speed-submenu" class="submenu">
            <button id="slow-speed-btn" type="button"></button>
            <button id="medium-speed-btn" class="selected" type="button"></button>
            <button id="fast-speed-btn" type="button"></button>
          </div>

          <button id="winning-score-submenu-btn" class="submenu-btn" type="button"></button>
          <div id="winning-score-submenu" class="submenu">
            <button id="winning-score-5-btn" type="button"></button>
            <button id="winning-score-10-btn" type="button"></button>
            <button id="winning-score-15-btn" class="selected" type="button"></button>
          </div>

          <button id="practice-mode-submenu-btn" class="submenu-btn" type="button"></button>
          <div id="practice-mode-submenu" class="submenu">
            <button id="practice-mode-on-btn" type="button"></button>
            <button id="practice-mode-off-btn" class="selected" type="button"></button>
          </div>

          <button id="reset-to-default-btn" type="button"></button>
        </div>

        <button id="about-btn" type="button">
          <span class="text-about"></span>
          <span class="text-play"></span>
        </button>
      </div>

      <div id="about-box" class="fade-in-box hidden" aria-hidden="true">
        <button id="close-about-btn" type="button">
          <span class="text-close"></span>
          <span class="text-play"></span>
        </button>
      </div>

      <div id="notice-box-1" class="fade-in-box hidden" aria-hidden="true">
        <span id="winning-score-in-notice-box-1"></span>
        <button id="notice-ok-btn-1" type="button"></button>
      </div>

      <div id="notice-box-2" class="fade-in-box hidden" aria-hidden="true">
        <button id="notice-ok-btn-2" type="button"></button>
      </div>

      <div id="loading-box" class="fade-in-box hidden" aria-hidden="true">
        <div id="progress-bar"></div>
      </div>
    </div>
  </body>
</html>
